# 커뮤니티 인기 글 카카오톡 다이제스트 — 3일 주기 09:00 KST
# cron은 매일 00:00 UTC(=09:00 KST)에 깨우고, epoch-day % 3 게이트로 3일 주기를 만든다.
# (cron의 */3은 일(day-of-month) 기반이라 월말에 주기가 틀어짐 — 게이트 방식이 정확)
# 기준 정렬: 2026-07-21(epoch-day 20655, 20655 % 3 == 0)부터 3일 간격.
name: community-digest

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # reports/ PDF 커밋·푸시용
    steps:
      - name: 3일 주기 게이트
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ $(( $(date +%s) / 86400 % 3 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "오늘은 실행일이 아님 (epoch-day % 3 != 0)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: 의존성 설치
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 다이제스트 수집·요약·PDF·전송
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          # for-marketing 허브 push(IG 카드뉴스 원재료). 둘 다 없으면 hub_sender가
          # 조용히 생략하므로, 미설정이어도 다이제스트 발송 자체는 정상 동작한다.
          HUB_BASE_URL: ${{ vars.HUB_BASE_URL }}
          HUB_INGEST_SECRET: ${{ secrets.HUB_INGEST_SECRET }}
          PYTHONIOENCODING: utf-8
        run: python main.py
